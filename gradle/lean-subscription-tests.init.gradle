// Run only the subscription rewrite checks; legacy tests target older Spring Boot APIs.
gradle.projectsEvaluated {
    allprojects {
        plugins.withId('java') {
            sourceSets.test.java.setIncludes([
                '**/OwnerAccountProfileServiceTest.java',
                '**/OwnerAccountServiceTest.java',
                '**/ProfileSaveRequestTest.java',
                '**/VehicleSubscriptionServiceTest.java',
                '**/VehicleSubscriptionPaymentServiceTest.java',
                '**/SubscriptionGatewayInvoiceTest.java',
                '**/ProfileRegistrationGuardTest.java',
                '**/SubscriptionQueryMappingTest.java'
            ] as Set)
            tasks.withType(Test).configureEach {
                doFirst {
                    def mockitoAgent = configurations.testRuntimeClasspath.find {
                        it.name.startsWith('mockito-core-') && it.name.endsWith('.jar')
                    }
                    if (mockitoAgent != null) {
                        jvmArgs "-javaagent:${mockitoAgent.absolutePath}"
                    }
                }
            }
        }
    }
}
