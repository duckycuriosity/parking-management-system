// Select the complete owner-profile, pricing, subscription and parking-payment
// suites. Unrelated legacy tests still reference APIs and classes no longer present;
// no selected module's failing test is excluded.
// Usage: ./gradlew --init-script gradle/owner-profile-tests.init.gradle test
allprojects {
    plugins.withId('java') {
        sourceSets.test.java.setIncludes([
                'vio/barie/core/service/FeePolicyServiceTest.java',
                'vio/barie/core/config/auth/FeePolicySecurityTest.java',
                'vio/barie/core/persistence/SubscriptionJpaTestSupport.java',
                'vio/barie/core/persistence/ParkingFeeJpaTestSupport.java',
                'vio/barie/core/service/FeeCalculatorTestSupport.java',
                'vio/barie/core/**/*Owner*Test.java',
                'vio/barie/core/**/*Owner*IntegrationTest.java',
                'vio/barie/core/**/*Owner*TestSupport.java',
                'vio/barie/core/**/*Profile*Test.java',
                'vio/barie/core/**/*Profile*IntegrationTest.java',
                'vio/barie/core/**/*Profile*TestSupport.java',
                'vio/barie/core/**/*Ai*Test.java',
                'vio/barie/core/**/*Subscription*Test.java',
                'vio/barie/core/**/*Subscription*IntegrationTest.java',
                'vio/barie/core/**/*ParkingFee*Test.java',
                'vio/barie/core/**/*ParkingFee*IntegrationTest.java',
                'vio/barie/core/**/*ParkingPayment*Test.java',
                'vio/barie/core/**/*ParkingPayment*IntegrationTest.java',
                'vio/barie/core/**/*FeeCalculator*Test.java',
                'vio/barie/core/**/*TimeBlock*Test.java',
                'vio/barie/core/**/*DailyEntry*Test.java',
                'vio/barie/core/**/*Coverage*Test.java'
        ])
        tasks.named('test') {
            useJUnitPlatform()
            doFirst {
                def agent = configurations.testRuntimeClasspath.files.find {
                    it.name.startsWith('mockito-core-') && it.name.endsWith('.jar')
                }
                if (agent == null) {
                    throw new GradleException('Mockito startup agent unavailable')
                }
                jvmArgs("-javaagent:${agent.absolutePath}")
            }
        }
    }
}
