version: '3.9'

services:
  postgres:
    image: postgres:18
    container_name: barie-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: barie
      POSTGRES_USER: barie_dev
      POSTGRES_PASSWORD: "n7FuKNTV@@"
      TZ: "Asia/Ho_Chi_Minh"
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: barie-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: barie_postgres_data
  redis_data:
    name: barie_redis_data
