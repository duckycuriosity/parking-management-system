spring:
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:https://sso.safelinksystem.app/realms/barie}
  datasource:
    url: jdbc:postgresql://host.docker.internal:5434/barie
    username: barie_dev
    password: n7FuKNTV@@
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: HikariDev
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 20000

logging:
  level:
    org.flywaydb: DEBUG
    org.springframework.boot.flyway.autoconfigure: DEBUG
    org.eclipse.paho.client.mqttv3: DEBUG
    vio.barie.core.service.mqtt: DEBUG

bootstrap:
  admin:
    token: dev-bootstrap-token

mqtt:
  host: tcp://host.docker.internal:1883
  username:
  password:
  client-id: barie-core-service-dev-1234123123
  # tuning values for diagnostics; adjust as needed
  keep-alive-seconds: 120
  connection-timeout-seconds: 60
  max-inflight: 100
  clean-session: true
  device-register-topic: "parking/v1/client/#"
  aibox-face-topic: "aibox/face"
  aibox-plate-topic: "aibox/licenseplate"
  publish-cmd-topic-prefix: "parking/v1/server"
  publish-cmd-topic-suffix: "/cmd"
  publish-error-topic-suffix: "/error"
  receive-ai-event: "aibox/face/#"
  queue:
    core-pool-size: 5
    max-pool-size: 10
    queue-capacity: 100

