mqtt:
  host: tcp://192.168.168.30:1883
  username:
  password:
  client-id: barie-core-service-devs
  device-register-topic: parking/v1/client/#  # Parking Client
  publish-cmd-topic-prefix: "parking/v1/server"
  publish-cmd-topic-suffix: "/cmd"
  receive-ai-event: aibox/face/#

spring:
  profiles:
    active: dev
  application:
    name: core
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  jpa:
    hibernate:
      ddl-auto: none

ai:
  core:
    base-url: http://192.168.168.30:8088/api
    user-agent: Mozilla/5.0
    accept: "*/*"
    cookie: key=uO50EwSqoolz1OzU
    connection: close
  face:
    base-url: http://192.168.168.30:8088
    cookie-key: uO50EwSqoolz1OzU
    face-image-url: http://192.168.168.30:8088/api/FaceImage/
logging:
  level:
    org.flywaydb: DEBUG
    org.springframework.boot.flyway.autoconfigure: DEBUG
parking:
  config:
    pay-per-use-tickets: DAILY,EVENT,VIP
# Swagger/OpenAPI Configuration
springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
    filter: true
    display-request-duration: true
  show-actuator: false
  packages-to-scan: vio.barie.core.controller
  paths-to-match: /**