spring:
  profiles:
    active: dev
  application:
    name: core
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  jpa:
    hibernate:
      ddl-auto: none
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:https://sso.safelinksystem.app/realms/barie}


ai:
  core:
    base-url: http://192.168.168.30:8088/api
    user-agent: Mozilla/5.0
    accept: "*/*"
    cookie: key=uO50EwSqoolz1OzU
    connection: close

logging:
  level:
    org.flywaydb: DEBUG
    org.springframework.boot.flyway.autoconfigure: DEBUG

bootstrap:
  admin:
    token:

keycloak:
  server-url: ${KEYCLOAK_URI:https://sso.safelinksystem.app}
  realm: barie
  admin-realm: barie
  admin-client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:barie-client-be-dev}
  admin-client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:tDywGUVz29rYQ3JlBNlXXu0V0VshWY0E}