spring:
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  application:
    name: core

  datasource:
    url: jdbc:postgresql://localhost:5432/payment_core
    username: postgres
    password: 123123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none

logging:
  level:
    org.flywaydb: DEBUG
    org.springframework.boot.flyway.autoconfigure: DEBUG