mqtt:
  host: tcp://192.168.168.30:1883
  username:
  password:
  client-id: barie-core-service-devs
  device-register-topic: parking/v1/client/#  # Parking Client
  publish-cmd-topic-prefix: "parking/v1/server"
  publish-cmd-topic-suffix: "/cmd"
  receive-ai-event: aibox/face/#

server:
  port: 1081

spring:
  profiles:
    active: prod
  application:
    name: core
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  jpa:
    hibernate:
      ddl-auto: none

ai:
  core:
    base-url: http://192.168.168.30:8088/api
    user-agent: Mozilla/5.0
    accept: "*/*"
    cookie: key=uO50EwSqoolz1OzU
    connection: close
  face:
    base-url: http://192.168.168.30:8088
    stream-url: http://192.168.168.31:5000
    cookie-key: uO50EwSqoolz1OzU
    face-image-url: http://192.168.168.30:8088/api/FaceImage/
  quality:
    face:
      min-quality-score: 0.5
      min-det-score: 0.6
      min-blur-score: 30
      max-yaw-deg: 45
      max-pitch-deg: 45
      require-usable: true
    plate:
      min-quality-score: 0.5
logging:
  level:
    org.flywaydb: DEBUG
    org.springframework.boot.flyway.autoconfigure: DEBUG
parking:
  config:
    pay-per-use-tickets: DAILY,EVENT,VIP

barrier:
  detection:
    # Cua so toi da giua lan thay plate cuoi va face khop (ms). Thuc te quan sat
    # duoc nguoi dan xe co the mat toi ~3 phut moi co 1 frame face du chat luong,
    # nen de 3 phut thay vi 2 phut mac dinh cu.
    business-window-ms: 180000
    # TTL cua session Redis (giay) - phai LON HON business-window-ms/1000,
    # neu khong Redis se tu xoa key truoc khi logic business kip bao "stale".
    session-ttl-seconds: 210
    # Khoang cach toi da (ms) giua 2 message plate lien tiep de con tinh la
    # cung 1 lan quet (burst) cua cung 1 xe.
    burst-gap-ms: 8000
    # Sau khi 1 luot entry/exit thanh cong, khoa lane trong khoang nay (ms) de
    # bo qua plate/face phat sinh do xe con nam trong khung hinh camera.
    post-match-cooldown-ms: 15000
# Swagger/OpenAPI Configuration
springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
    filter: true
    display-request-duration: true
  show-actuator: false
  packages-to-scan: vio.barie.core.controller
  paths-to-match: /**